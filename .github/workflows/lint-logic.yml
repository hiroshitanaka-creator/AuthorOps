name: Logic Lint — 論理的整合性の検査

on:
  pull_request:
    paths:
      - "src/**/*.md"
  push:
    branches: [main]
    paths:
      - "src/**/*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic>=2.0 markdown-it-py>=3.0

      - name: Run rule-based logic lint
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from tools.authorops.air.parser import parse_markdown_to_air
          from tools.authorops.lint.rules import lint_air, format_issues_as_markdown
          from tools.authorops.config import load_config, is_excluded

          config = load_config()
          all_issues = []
          src = Path('src')

          for md_file in sorted(src.rglob('*.md')):
            if is_excluded(md_file, config):
              print(f'  skip: {md_file}')
              continue
            air = parse_markdown_to_air(md_file)
            issues = lint_air(air)
            if issues:
              print(f'  {md_file}: {len(issues)} issue(s)')
              all_issues.extend(issues)

          result = format_issues_as_markdown(all_issues)
          Path('lint_result.md').write_text(result)
          print(result)

          # error レベルの指摘があれば CI を失敗させる
          errors = [i for i in all_issues if i.severity == 'error']
          if errors:
            print(f'::error::論理検査で {len(errors)} 件のエラーが検出されました')
            sys.exit(1)
          "

      - name: Post lint result as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('lint_result.md')) process.exit(0);
            const body = fs.readFileSync('lint_result.md', 'utf8');
            const marker = '<!-- authorops:lint-logic -->';
            const full = marker + '\n' + body;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: full });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: full });
            }
